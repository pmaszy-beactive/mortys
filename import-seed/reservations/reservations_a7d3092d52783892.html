            $("#classes").on('click', '.closedcircuitstream', function () {

              var scheduledClassSequenceId=  $(this).find('input').val()
         

              var row   =  $.grep(streams, function(item){
                return item.scheduledClassSequenceId == scheduledClassSequenceId;
            })[0];

       
              
              var msgText = '<div class="confirmationmessage" ><div> Read carefully: You are about to confirm your closed-track reservation of the following '+ row.classes.length +' dates and times:</div> <div class=times></div><div></div>';
              if(row.HoursUntilStart>48)
              {
                  msgText+='You may cancel your reservation without penalty up to 48 hours before the first class begins. After that, you will be assessed a  <b style="color:red">$75.00 fee if you cancel or miss any of the four reserved lessons</b>.'
              }
              else
              {
                  msgText+='The first class begins in less than 48 hours. Therefore,   you will be assessed a  <b style="color:red">$75.00 fee if you cancel or miss any of the four reserved lessons</b>.'
              }
         
            + 'Additionally, missing a reserved class will delay completion of your course. Please check your dates and times carefully before confirming!';

                 BootstrapDialog.confirm({

            btnCancelLabel: 'No Thanks', 
            btnOKLabel: 'Confirm',  
                    
            btnOKClass: 'btn-warning', 
            callback: function(result) {
                
                if (result) {
                    
                   var  stream=$.grep(streams, function(item){return item.scheduledClassSequenceId == scheduledClassSequenceId; })[0],
                       scheduledClassIds = jQuery.map(stream.classes, function (a) { return a.scheduledClassId; }),
                       courseComponentIds = jQuery.map(stream.classes, function (a) { return a.courseComponentId; })
                    
                      
                    $.ajax({
                        type: "POST",
                        url: 'reserveStream_ajax/?studentUserId='+ globals.studentUserId,  //must put userid here, otherwise it does not get picked up when authenticating specific student
                        data: JSON.stringify( {                        
                            scheduledClassSequenceId: scheduledClassSequenceId,
                            courseId: globals.courseId,
                            actionId: globals.actionId,
                            scheduledClassIds: scheduledClassIds,
                           courseComponentIds: courseComponentIds
                        }),

                          contentType: "application/json; charset=utf-8",  
                          dataType: "json",  
                    
                 
                      
                    }).done(function (response) {                       
                        if (response.errors) {
                           
                                var msg = response.errors[0] == "overbooked" ? "Oops! Someone else just took the last spot. Try again." : response.errors.join("<br>");

                                BootstrapDialog.alert({
                                    message: msg, title: "There was a problem", type: BootstrapDialog.TYPE_DANGER,
                                    callback: function () { location.reload(); }

                                });

                
                        }
                        else {
                            BootstrapDialog.alert({
                                message: "Your spots have been reserved.", title: "Success!", type: BootstrapDialog.TYPE_SUCCESS,
                                callback: function () { window.history.back(); }
                            })

                        }
